site_name: Norse Demigods Wiki
site_description: Player guide to the Norse Demigods mod for Valheim.
site_url: https://brewland.github.io/NorseDemigodsWiki/
repo_url: https://github.com/Brewland/NorseDemigodsWiki
repo_name: Brewland/NorseDemigodsWiki

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
  - Demigods:
      - demigods/index.md
  - Abilities:
      - abilities/index.md
  - Attributes:
      - attributes/index.md
  - Items:
      - items/index.md
  - Companions:
      - companions/index.md
  - Reference:
      - reference/index.md
