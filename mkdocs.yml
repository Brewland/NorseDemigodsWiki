site_name: Norse Demigods Wiki
site_description: Player guide to the Norse Demigods mod for Valheim.
site_url: https://brewland.github.io/NorseDemigodsWiki/
repo_url: https://github.com/Brewland/NorseDemigodsWiki
repo_name: Brewland/NorseDemigodsWiki

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys:
      key_map:
        mouse-side-up: Upper Side Mouse
        mouse-side-down: Lower Side Mouse
        mouse-middle: Middle Mouse
        block: Block
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Glossary: getting-started/glossary.md
  - Demigods:
      - demigods/index.md
      - Thor: demigods/thor.md
  - Abilities:
      - abilities/index.md
      - Teleport: abilities/teleport.md
      - Dash: abilities/dash.md
      - Lightning Aura: abilities/lightning-aura.md
      - Lightning Storm: abilities/lightning-storm.md
      - Lightning Strike: abilities/lightning-strike.md
      - Restoration: abilities/restoration.md
  - Attributes:
      - attributes/index.md
      - Movement and Stamina: attributes/movement-and-stamina.md
      - Strength: attributes/strength.md
      - Static Body: attributes/static-body.md
  - Items:
      - items/index.md
  - Companions:
      - companions/index.md
  - Reference:
      - reference/index.md
